<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top, #0f172a, #020617);
            font-family: Arial, sans-serif;
            color: #fff;
        }

        .container {
            padding: 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(14px);
            border-radius: 18px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-6px);
        }

        .symbol {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .price {
            font-size: 28px;
            font-weight: bold;
            color: #22d3ee;
        }

        .market {
            font-size: 12px;
            opacity: 0.7;
            margin-top: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="grid">

        <div class="card">
            <div class="symbol">RELIANCE</div>
            <div class="price" id="RELIANCE">Loading…</div>
            <div class="market">NSE Market</div>
        </div>

        <div class="card">
            <div class="symbol">TCS</div>
            <div class="price" id="TCS">Loading…</div>
            <div class="market">NSE Market</div>
        </div>

        <div class="card">
            <div class="symbol">HDFCBANK</div>
            <div class="price" id="HDFCBANK">Loading…</div>
            <div class="market">NSE Market</div>
        </div>

        <div class="card">
            <div class="symbol">INFY</div>
            <div class="price" id="INFY">Loading…</div>
            <div class="market">NSE Market</div>
        </div>

        <div class="card">
            <div class="symbol">ICICIBANK</div>
            <div class="price" id="ICICIBANK">Loading…</div>
            <div class="market">NSE Market</div>
        </div>

        <div class="card">
            <div class="symbol">SBIN</div>
            <div class="price" id="SBIN">Loading…</div>
            <div class="market">NSE Market</div>
        </div>

        <div class="card">
            <div class="symbol">ITC</div>
            <div class="price" id="ITC">Loading…</div>
            <div class="market">NSE Market</div>
        </div>

        <div class="card">
            <div class="symbol">WIPRO</div>
            <div class="price" id="WIPRO">Loading…</div>
            <div class="market">NSE Market</div>
        </div>

    </div>
</div>

<script>
    const stocks = [
        "RELIANCE",
        "TCS",
        "HDFCBANK",
        "INFY",
        "ICICIBANK",
        "SBIN",
        "ITC",
        "WIPRO"
    ];

    function loadPrices() {
        stocks.forEach(symbol => {
            fetch(`/stock/${symbol}/`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById(symbol).innerText =
                        "₹" + Number(data.price).toFixed(2);
                })
                .catch(() => {
                    document.getElementById(symbol).innerText = "Error";
                });
        });
    }

    loadPrices();
</script>

</body>
</html>
