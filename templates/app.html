<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Grid Stock Cards</title>

<style>
    body {
        margin: 0;
        padding: 30px;
        font-family: Poppins, sans-serif;
        background: linear-gradient(135deg, #0a0f24, #151d35);
        color: #fff;
        display: flex;
        justify-content: center;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 22px;
        max-width: 1100px;
        width: 100%;
    }

    .card {
        backdrop-filter: blur(14px);
        background: rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 18px;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 8px 26px rgba(0,0,0,0.3);
        transition: 0.3s ease;
    }
    .card:hover {
        transform: translateY(-6px);
        box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    }

    .logo {
        width: 55px;
        height: 55px;
        border-radius: 14px;
        overflow: hidden;
        margin: auto;
        margin-bottom: 12px;
        border: 1px solid rgba(255,255,255,0.1);
    }

    .logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .symbol {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .price {
        font-size: 26px;
        margin-top: 8px;
        color: #00eaff;
        font-weight: 800;
    }

    .small {
        font-size: 12px;
        color: #c7d3ec;
        margin-top: 4px;
    }

</style>

</head>
<body>

<div class="grid" id="stockGrid"></div>

<script>

const symbols = ["RELIANCE", "TCS", "HDFCBANK", "INFY", "ICICIBANK", "SBIN", "ITC", "WIPRO"];

function createCard(symbol, price = null) {
    return `
        <div class="card">
            <div class="logo">
                <img src="https://logo.clearbit.com/${symbol.toLowerCase()}.com"
                     onerror="this.src='https://via.placeholder.com/60'" />
            </div>
            <div class="symbol">${symbol}</div>
            <div class="price">${price ? "₹" + price : "Loading..."}</div>
            <div class="small">NSE Market</div>
        </div>
    `;
}

// initial loading cards
const grid = document.getElementById("stockGrid");
symbols.forEach(sym => grid.innerHTML += createCard(sym));

// API fetch
symbols.forEach(sym => {
    fetch(`/stock/${sym}/`)
        .then(res => res.json())
        .then(data => {
            if (data.price) {
                const cards = document.querySelectorAll(".card");
                cards.forEach(card => {
                    if (card.querySelector(".symbol").textContent === sym) {
                        card.querySelector(".price").textContent = "₹" + data.price.toFixed(2);
                    }
                });
            }
        });
});
</script>

</body>
</html>
